listener 1883
protocol mqtt
allow_anonymous true

# 浏览器 / 管理端可用 mqtt.js 直连订阅登录码事件（auth/login/qr/{ticket}）
listener 9001
protocol websockets
allow_anonymous true

# upload.put 经 MQTT 传 base64：15MB 文件约 20MB+ 包；过小会被踢掉并表现为网关 504
# Mosquitto 2.1 默认有上限，需显式放大（字节）
max_packet_size 33554432

persistence false
log_type error
log_type warning
log_type notice
log_type information

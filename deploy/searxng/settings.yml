use_default_settings: true

general:
  instance_name: "wiki-search"

server:
  # 本机部署用。公网不要暴露 8888。
  secret_key: "wiki-search-local-only-not-for-public"
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "zh-CN"
  formats:
    - html
    - json

# 全量开发/全量部署。裁剪场景的 compose 在 deploy/<场景>/docker-compose.yml。
x-app-env: &app-env
  MQTT_URL: mqtt://mosquitto:1883
  DATABASE_URL: postgres://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-nestjs}@postgres:5432/${POSTGRES_DB:-nestjs}
  DOCS_DATABASE_URL: postgres://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-nestjs}@postgres:5432/docs
  WECHAT_DATABASE_URL: postgres://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-nestjs}@postgres:5432/wechat
  RECYCLE_DATABASE_URL: postgres://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-nestjs}@postgres:5432/recycle
  MEDICAL_DATABASE_URL: postgres://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-nestjs}@postgres:5432/medical
  REDIS_URL: redis://redis:6379
  UPLOAD_API_KEY: ${UPLOAD_API_KEY:-dev-upload-key}
  DOCS_SERVICE_KEY: ${DOCS_SERVICE_KEY:-dev-docs-key}
  APP_VERSION: ${APP_VERSION:-0.0.1}
  EXPECTED_APP_VERSION: ${EXPECTED_APP_VERSION:-${APP_VERSION:-0.0.1}}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3100,http://127.0.0.1:3100}

x-app-depends: &app-depends
  mosquitto:
    condition: service_started
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  postgres:
    # pgvector 扩展：agents RAG 向量检索依赖；已有 volume 需手动 CREATE EXTENSION
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nestjs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nestjs}
      POSTGRES_DB: ${POSTGRES_DB:-nestjs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nestjs} -d ${POSTGRES_DB:-nestjs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      <<: *app-env
      PORT: 3000
      MQTT_TIMEOUT_MS: 5000
      AGENTS_MQTT_TIMEOUT_MS: ${AGENTS_MQTT_TIMEOUT_MS:-90000}
      AGENTS_HTTP_URL: http://agents:3006
    depends_on: *app-depends

  usercenter:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: usercenter
    restart: unless-stopped
    environment:
      <<: *app-env
      SEED_APP_CODE: ${SEED_APP_CODE:-web}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_MP_CODE: ${WECHAT_MP_CODE:-wechat}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
    depends_on: *app-depends

  order:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: order
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on: *app-depends

  docs:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: docs
    restart: unless-stopped
    environment:
      <<: *app-env
      INSTANCE_ID: docs-1
    depends_on: *app-depends

  upload:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: upload
    restart: unless-stopped
    environment:
      <<: *app-env
      INSTANCE_ID: upload-1
    depends_on: *app-depends

  wechat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: wechat
    restart: unless-stopped
    environment:
      <<: *app-env
      INSTANCE_ID: wechat-1
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      WECHAT_MP_CODE: ${WECHAT_MP_CODE:-wechat}
    depends_on: *app-depends

  recycle:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: recycle
    restart: unless-stopped
    environment:
      <<: *app-env
      INSTANCE_ID: recycle-1
      RECYCLE_INTERNAL_KEY: ${RECYCLE_INTERNAL_KEY:-dev-recycle-internal-key}
    depends_on: *app-depends

  medical:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: medical
    restart: unless-stopped
    environment:
      <<: *app-env
      INSTANCE_ID: medical-1
      TYPEORM_SYNC: ${TYPEORM_SYNC:-true}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-tcm123456}
      AUTH_SECRET: ${AUTH_SECRET:-tcm-dev-auth-secret-change-me}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LLM_REASONER_MODEL: ${LLM_REASONER_MODEL:-}
      TCM_SKILLS_DIR: ${TCM_SKILLS_DIR:-}
    depends_on: *app-depends

  agents:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: agents
    restart: unless-stopped
    environment:
      <<: *app-env
      INSTANCE_ID: agents-1
      AGENTS_HTTP_PORT: 3006
      AI_API_BASE: ${AI_API_BASE:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_EMBEDDING_API_BASE: ${AI_EMBEDDING_API_BASE:-}
      AI_EMBEDDING_API_KEY: ${AI_EMBEDDING_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_EMBEDDING_DIM: ${AI_EMBEDDING_DIM:-1536}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-90000}
      AGENTS_DATABASE_URL: postgres://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-nestjs}@postgres:5432/agents
    depends_on: *app-depends

volumes:
  postgres_data:
  redis_data:

# 只起依赖：docker compose up -d postgres redis mosquitto
# 对象存储用环境变量配 OSS / COS / 自建 MinIO，不随本仓库默认拉起 MinIO。
# 只对外暴露 gateway:3000，内部实例通过 MQTT 共享订阅做负载均衡。
# 默认每个业务服务 1 个实例。需要扩容再加 --scale。

x-app-env: &app-env
  MQTT_URL: mqtt://mosquitto:1883
  DATABASE_URL: postgres://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-nestjs}@postgres:5432/${POSTGRES_DB:-nestjs}
  DOCS_DATABASE_URL: postgres://${POSTGRES_USER:-nestjs}:${POSTGRES_PASSWORD:-nestjs}@postgres:5432/docs
  REDIS_URL: redis://redis:6379
  UPLOAD_API_KEY: ${UPLOAD_API_KEY:-dev-upload-key}
  UPLOAD_DRIVER: ${UPLOAD_DRIVER:-minio}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-uploads}

x-app-depends: &app-depends
  mosquitto:
    condition: service_started
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nestjs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nestjs}
      POSTGRES_DB: ${POSTGRES_DB:-nestjs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nestjs} -d ${POSTGRES_DB:-nestjs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      <<: *app-env
      PORT: 3000
      MQTT_TIMEOUT_MS: 5000
    depends_on: *app-depends

  usercenter:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: usercenter
    restart: unless-stopped
    environment:
      <<: *app-env
      WECHAT_MOCK: ${WECHAT_MOCK:-1}
      SEED_APP_ID: ${SEED_APP_ID:-default}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
    depends_on: *app-depends

  order:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: order
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on: *app-depends

  docs:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: docs
    restart: unless-stopped
    environment:
      <<: *app-env
      INSTANCE_ID: docs-1
      DOCS_SERVICE_KEY: ${DOCS_SERVICE_KEY:-dev-docs-key}
    depends_on: *app-depends

  upload:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        APP_NAME: upload
    restart: unless-stopped
    environment:
      <<: *app-env
      INSTANCE_ID: upload-1
    depends_on:
      <<: *app-depends
      minio:
        condition: service_started

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:

# 只起依赖：docker compose up -d postgres redis mosquitto
# 默认按 3 个 usercenter + 1 个 order + 1 个 docs + 1 个 upload 扩容。
# 只对外暴露 gateway:3000，内部实例通过 MQTT 共享订阅做负载均衡。
# 扩缩容：docker compose up --build --scale usercenter=3 --scale order=1 --scale docs=1 --scale upload=1
